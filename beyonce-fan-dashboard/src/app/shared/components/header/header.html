<header class="topbar">
  <div class="page-title">
    <span class="eyebrow">Renaissance Hub</span>
    <h2>Dashboard</h2>
  </div>

  <div class="topbar-actions">
    <label class="search">
      <span>⌕</span>

      <input
        type="search"
        placeholder="Search songs, albums, eras..."
        aria-label="Search"
      />

      <kbd>⌘ K</kbd>
    </label>

    <button class="notification" type="button" aria-label="Notifications">
      ♢
      <span></span>
    </button>

    <button class="profile" type="button">
      <span class="avatar">KS</span>

      <span class="profile-copy">
        <strong>Kelvin</strong>
        <small>Developer</small>
      </span>

      <span class="profile-arrow">⌄</span>
    </button>
  </div>
</header>
