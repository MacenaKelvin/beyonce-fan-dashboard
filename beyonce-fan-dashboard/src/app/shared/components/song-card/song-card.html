<article
  class="song-item"
  [class.is-playing]="
    player.currentTrack()?.name === track().name && player.isPlaying()
  "
>
  <span class="rank">
    {{ (index() + 1).toString().padStart(2, '0') }}
  </span>

  <div class="cover">
    @if (track().image) {
      <img [src]="track().image" [alt]="track().name" />
    } @else {
      {{ track().name.charAt(0) }}
    }

    <button
      class="cover-play"
      type="button"
      [disabled]="!track().previewUrl"
      (click)="playPreview()"
      [attr.aria-label]="'Play preview of ' + track().name"
    >
      @if (
        player.currentTrack()?.name === track().name &&
        player.isPlaying()
      ) {
        ❚❚
      } @else {
        ▶
      }
    </button>
  </div>

  <div class="song-info">
    <div class="song-title">
      <strong>{{ track().name }}</strong>

      @if (index() === 0) {
        <span class="trending">Trending</span>
      }
    </div>

    <small>{{ track().album || track().artist }}</small>
  </div>

  <span class="plays">
    {{ track().playcount | compactNumber }} plays
  </span>
</article>
