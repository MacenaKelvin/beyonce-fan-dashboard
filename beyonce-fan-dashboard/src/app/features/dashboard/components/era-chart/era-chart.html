<section class="era-chart-card">
  <div class="section-header">
    <div>
      <span>Era analytics</span>
      <h3>Era Distribution</h3>
    </div>

    <span class="live-badge">
      <i></i>
      Live data
    </span>
  </div>

  <div class="chart-content">
    <div class="chart-wrapper">
      <canvas
        baseChart
        [type]="chartType"
        [data]="chartData"
        [options]="chartOptions"
      >
      </canvas>

      <div class="chart-center">
        <strong>8</strong>
        <span>eras</span>
      </div>
    </div>

<div class="legend">
  @for (era of eras; track era.name) {
    <div class="legend-item">
      <span
        class="legend-color"
        [style.background]="era.color"
      ></span>

      <span class="legend-name">
        {{ era.name }}
      </span>

      <strong>{{ era.value }}%</strong>
    </div>
  }
</div>
  </div>
</section>
